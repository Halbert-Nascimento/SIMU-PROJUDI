{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>{% block title %}Simulador-Projudi{% endblock %}</title>

    <!-- Tailwind CSS para estilização idêntica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="{% static 'js/tailwind.config.base.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="text-tjgo-text-main font-sans text-sm antialiased">
    {% block content %}
        <!-- Conteúdo específico de cada página será inserido aqui -->
    {% endblock %}
    
    <!-- Rodapé -->
    <footer class="footer">
        <div class="footer-content">
            <div>
                <i class="fa-solid fa-graduation-cap mr-1"></i>
                <strong>Simulador Universitário Projudi</strong> | Faculdade IESGO
            </div>
            <div>
                <span class="footer-badge">Em Desenvolvimento</span>
            </div>
        </div>
    </footer>
</body>
</html>
