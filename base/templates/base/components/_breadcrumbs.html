{% if breadcrumbs %}
<nav class="text-meta text-rotulo mb-3 flex items-center gap-1.5" aria-label="Navegação">
    {% for item in breadcrumbs %}
        {% if not forloop.last %}
            <a href="{{ item.url }}" class="text-acao hover:text-navy hover:underline">{{ item.label }}</a>
            <i class="fa-solid fa-chevron-right text-[8px] text-rotulo"></i>
        {% else %}
            <span class="text-texto font-semibold">{{ item.label }}</span>
        {% endif %}
    {% endfor %}
</nav>
{% endif %}
